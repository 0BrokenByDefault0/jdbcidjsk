name: Build unsigned IPA

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          set -o pipefail
          xcodebuild \
            -project RecordRoom.xcodeproj \
            -scheme RecordRoom \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package into unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/RecordRoom.app"
          test -d "$APP" || { echo "App bundle not found"; ls -R build/Build/Products; exit 1; }
          rm -rf out Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          mkdir -p out
          zip -qry "out/RecordRoom-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh out

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RecordRoom-unsigned-ipa
          path: out/RecordRoom-unsigned.ipa
          if-no-files-found: error
          retention-days: 90
